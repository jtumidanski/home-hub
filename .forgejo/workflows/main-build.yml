name: Main - Build and Publish

# Forge port of .github/workflows/main.yml (Phase 5c).
#
# Departures from the original, all forced by the environment:
#
#   1. docker/build-push-action is gone. The runners are host mode -- the pod
#      IS the job environment and has no Docker daemon -- so builds go through
#      buildx with `driver: remote` against the in-cluster buildkitd, wrapped
#      by ci/actions/buildx-build@v1.
#   2. The registry is zot, and the credential is the zot `ci` user. The
#      original logged in to ghcr.io with `github.actor` + GITHUB_TOKEN; a
#      Forgejo run has no GHCR-valid token, so this needed a real secret
#      regardless of where the registry pointed.
#   3. The docker matrix is floored (see "Matrix floor" below).
#
# The image name keeps its flat hyphen scheme -- home-hub-<service>, not
# home-hub/<service> -- so the cluster's Deployments change registry host only.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (e.g. "dashboard-service") or "all"'
        required: true
        default: 'all'

env:
  REGISTRY: registry.tumidanski
  IMAGE_PREFIX: registry.tumidanski/jtumidanski/home-hub

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docker-matrix: ${{ steps.matrix.outputs.matrix }}
      docker-matrix-floor: ${{ steps.matrix.outputs.matrix-floor }}
      has-changes: ${{ steps.matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            auth:
              - 'services/auth-service/**'
              - 'shared/go/**'
            account:
              - 'services/account-service/**'
              - 'shared/go/**'
            calendar:
              - 'services/calendar-service/**'
              - 'shared/go/**'
            productivity:
              - 'services/productivity-service/**'
              - 'shared/go/**'
            weather:
              - 'services/weather-service/**'
              - 'shared/go/**'
            recipe:
              - 'services/recipe-service/**'
              - 'shared/go/**'
            category:
              - 'services/category-service/**'
              - 'shared/go/**'
            shopping:
              - 'services/shopping-service/**'
              - 'shared/go/**'
            package:
              - 'services/package-service/**'
              - 'shared/go/**'
            tracker:
              - 'services/tracker-service/**'
              - 'shared/go/**'
            workout:
              - 'services/workout-service/**'
              - 'shared/go/**'
            dashboard:
              - 'services/dashboard-service/**'
              - 'shared/go/**'
            frontend:
              - 'frontend/**'

      - name: Compute docker matrix
        id: matrix
        env:
          CHANGES: ${{ steps.changes.outputs.changes }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          ALL='[
            {"service":"auth-service","context":".","dockerfile":"services/auth-service/Dockerfile","changed":"auth"},
            {"service":"account-service","context":".","dockerfile":"services/account-service/Dockerfile","changed":"account"},
            {"service":"calendar-service","context":".","dockerfile":"services/calendar-service/Dockerfile","changed":"calendar"},
            {"service":"productivity-service","context":".","dockerfile":"services/productivity-service/Dockerfile","changed":"productivity"},
            {"service":"weather-service","context":".","dockerfile":"services/weather-service/Dockerfile","changed":"weather"},
            {"service":"recipe-service","context":".","dockerfile":"services/recipe-service/Dockerfile","changed":"recipe"},
            {"service":"category-service","context":".","dockerfile":"services/category-service/Dockerfile","changed":"category"},
            {"service":"shopping-service","context":".","dockerfile":"services/shopping-service/Dockerfile","changed":"shopping"},
            {"service":"package-service","context":".","dockerfile":"services/package-service/Dockerfile","changed":"package"},
            {"service":"tracker-service","context":".","dockerfile":"services/tracker-service/Dockerfile","changed":"tracker"},
            {"service":"workout-service","context":".","dockerfile":"services/workout-service/Dockerfile","changed":"workout"},
            {"service":"dashboard-service","context":".","dockerfile":"services/dashboard-service/Dockerfile","changed":"dashboard"},
            {"service":"frontend","context":"frontend","dockerfile":"frontend/Dockerfile","changed":"frontend"}
          ]'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_SERVICE" = "all" ]; then
              MATRIX=$(echo "$ALL" | jq -c '.')
            else
              MATRIX=$(echo "$ALL" | jq -c --arg s "$DISPATCH_SERVICE" 'map(select(.service == $s))')
            fi
          else
            MATRIX=$(echo "$ALL" | jq -c --argjson changes "$CHANGES" 'map(select(.changed as $c | $changes | index($c)))')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          # ----------------------------------------------------------------
          # Matrix floor -- a Forgejo divergence from GitHub Actions.
          #
          # On GitHub a strategy.matrix built from an empty array yields a job
          # that reports `skipped`, and dependents with `if: always()` proceed.
          # On Forgejo the job row is created at parse time as
          # "<name> (incomplete matrix)" and then DELETED when the real outputs
          # arrive and expansion yields zero entries. The job ceases to exist,
          # so every `needs:` edge naming it is unsatisfiable and dependents
          # sit at status `blocked` forever.
          #
          # The `if:` guard on build-and-push does NOT prevent this -- atlas
          # carried exactly that guard (`!= '[]'`) and deadlocked anyway, on
          # run 113, where the PR sat unmergeable because a required check
          # could never leave `pending`. Only a non-empty matrix prevents it.
          #
          # So: gate `if:` on has-changes, feed strategy.matrix from the
          # floored value. The sentinel never executes.
          if [ "$(echo "$MATRIX" | jq 'length')" -gt 0 ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "matrix-floor=$MATRIX" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo 'matrix-floor=[{"service":"(no affected services)","context":".","dockerfile":"","changed":""}]' >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and Push - ${{ matrix.service }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.docker-matrix-floor) }}

    steps:
      - name: Reset the job cache
        run: rm -rf /work/ci-cache

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select an amd64 BuildKit replica
        id: amd64
        uses: ci/actions/select-amd64-builder@v1
        with:
          index: 0

      - name: Build and push
        uses: ci/actions/buildx-build@v1
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          image: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: main,${{ github.sha }}
          platform: linux/amd64
          buildkit-endpoint: ${{ steps.amd64.outputs.endpoint }}
          push: 'true'
          registry: ${{ env.REGISTRY }}
          registry-username: ci
          registry-password: ${{ secrets.ZOT_CI_PASSWORD }}
          cache-scope: home-hub-${{ matrix.service }}-amd64

  publish-complete:
    name: Publish Complete
    needs: [detect-changes, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          DETECT: ${{ needs.detect-changes.result }}
          BUILD: ${{ needs.build-and-push.result }}
        run: |
          set -euo pipefail
          echo "detect-changes=$DETECT build-and-push=$BUILD"
          for r in "$DETECT" "$BUILD"; do
            case "$r" in
              success|skipped) ;;
              *) echo "FAIL: a publish job reported '$r'" >&2; exit 1 ;;
            esac
          done
          echo "OK"
